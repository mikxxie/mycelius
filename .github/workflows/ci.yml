name: mycelius CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout mycelius
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential ccache \
            gcc-aarch64-linux-gnu \
            cpio curl xz-utils \
            libncurses-dev bc flex bison libssl-dev libelf-dev dwarves

      - name: Cache ccache (native)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-native-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-native-

      - name: Cache ccache (cross)
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache-aarch64
          key: ${{ runner.os }}-ccache-cross-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-cross-

      - name: Cache Linux kernel (aarch64)
        uses: actions/cache@v4
        with:
          path: /tmp/mycelius-kernel
          key: ${{ runner.os }}-kernel-aarch64-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-aarch64-

      - name: Cache QEMU initramfs image
        uses: actions/cache@v4
        with:
          path: /tmp/mycelius-initramfs.gz
          key: ${{ runner.os }}-initramfs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-initramfs-

      - name: Build backboardd + launchpad (native Linux)
        env:
          CC: ccache cc
        run: |
          CC="ccache cc" make -C usr.sbin/backboardd
          CC="ccache cc" make -C usr.sbin/launchpad
          file usr.sbin/backboardd/backboardd usr.sbin/launchpad/launchpad

      - name: Clone + build Linux kernel (aarch64, from source)
        run: |
          if [ ! -d /tmp/linux ]; then
            git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git /tmp/linux
          fi
          cd /tmp/linux
          git pull --depth 1 || true
          make ARCH=arm64 defconfig >/dev/null 2>&1
          make ARCH=arm64 -j$(nproc) Image >/dev/null 2>&1
          cp arch/arm64/boot/Image /tmp/mycelius-kernel
          ls -lh /tmp/mycelius-kernel

      - name: Build QEMU initramfs image (cross-compiled aarch64)
        env:
          CCACHE_DIR: /home/runner/.ccache-aarch64
        run: |
          CCACHE_DIR=/home/runner/.ccache-aarch64 sh tools/build-qemu-img.sh /tmp
          ls -lh /tmp/mycelius-initramfs.gz /tmp/mycelius-kernel 2>/dev/null || true

      - name: Smoke test (synth input → launchpad render → PPM)
        run: |
          rm -f /tmp/lp_bb.sock /tmp/lp_frame.ppm
          ./usr.sbin/backboardd/backboardd -s /tmp/lp_bb.sock >/tmp/bb.log 2>&1 &
          BBPID=$!
          sleep 0.5
          ./usr.sbin/launchpad/launchpad -b /tmp/lp_bb.sock -o /tmp/lp_frame.ppm >/tmp/lp.log 2>&1 &
          LPPID=$!
          sleep 3
          kill $LPPID $BBPID 2>/dev/null || true
          wait $BBPID 2>/dev/null || true
          wait $LPPID 2>/dev/null || true
          test -s /tmp/lp_frame.ppm
          file /tmp/lp_frame.ppm | grep -q "480 x 800"
          echo "Smoke test PASSED — frame is $(wc -c < /tmp/lp_frame.ppm) bytes"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mycelius-build
          path: |
            /tmp/mycelius-initramfs.gz
            /tmp/mycelius-kernel
            usr.sbin/backboardd/backboardd
            usr.sbin/launchpad/launchpad
            /tmp/lp_frame.ppm
            /tmp/bb.log
            /tmp/lp.log
          retention-days: 7
