name: mycelius CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout mycelius
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 lld-18 ccache \
            qemu-system-aarch64 qemu-efi-aarch64 \
            dosfstools mtools parted

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build backboardd + launchpad (native, ccache)
        env:
          CC: ccache cc
        run: |
          CC="ccache cc" make -C usr.sbin/backboardd
          CC="ccache cc" make -C usr.sbin/launchpad

      - name: Smoke test (backboardd synth -> launchpad render -> PPM frame)
        run: |
          make -C usr.sbin/backboardd
          make -C usr.sbin/launchpad
          rm -f /tmp/lp_bb.sock /tmp/lp_frame.ppm
          ./usr.sbin/backboardd/backboardd -s /tmp/lp_bb.sock >/tmp/bb.log 2>&1 &
          BBPID=$!
          sleep 0.5
          ./usr.sbin/launchpad/launchpad -b /tmp/lp_bb.sock -o /tmp/lp_frame.ppm >/tmp/lp.log 2>&1 &
          LPPID=$!
          sleep 3
          kill $LPPID $BBPID 2>/dev/null || true
          wait $BBPID 2>/dev/null || true
          wait $LPPID 2>/dev/null || true
          test -s /tmp/lp_frame.ppm
          file /tmp/lp_frame.ppm | grep -q "480 x 800"

      - name: Assemble minimal UEFI boot disk image
        run: |
          IMG=/tmp/mycelius-arm64.img
          rm -f $IMG
          qemu-img create -f raw $IMG 2G
          parted $IMG --script mklabel gpt
          parted $IMG --script mkpart ESP fat32 1MiB 101MiB
          parted $IMG --script set 1 esp on
          parted $IMG --script mkpart rootfs freebsd-ufs 101MiB 100%
          ESP_START=$(parted $IMG --script unit s print | awk '/^ 1 /{print $2}' | tr -d s)
          dd if=/dev/zero of=/tmp/esp.fat bs=1M count=100
          mkfs.fat -F 32 /tmp/esp.fat
          mmd -i /tmp/esp.fat ::EFI
          mmd -i /tmp/esp.fat ::EFI/BOOT
          mmd -i /tmp/esp.fat ::mycelius
          mcopy -i /tmp/esp.fat usr.sbin/backboardd/backboardd ::mycelius/
          mcopy -i /tmp/esp.fat usr.sbin/launchpad/launchpad ::mycelius/
          mcopy -i /tmp/esp.fat /tmp/lp_frame.ppm ::mycelius/frame.ppm
          printf 'ELF placeholder - replace with real FreeBSD loader.efi' > /tmp/loader.efi
          mcopy -i /tmp/esp.fat /tmp/loader.efi ::EFI/BOOT/BOOTAA64.EFI
          dd if=/tmp/esp.fat of=$IMG bs=512 seek=$ESP_START conv=notrunc
          echo "Image created: $IMG"
          ls -lh $IMG

      - name: QEMU UEFI boot test
        run: |
          timeout 60 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a72 \
            -m 2G \
            -smp 2 \
            -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd \
            -drive file=/tmp/mycelius-arm64.img,format=raw,if=none,id=hd0 \
            -device virtio-blk-device,drive=hd0 \
            -display none \
            -serial stdio \
            -no-reboot \
            || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mycelius-build
          path: |
            /tmp/mycelius-arm64.img
            usr.sbin/backboardd/backboardd
            usr.sbin/launchpad/launchpad
            /tmp/lp_frame.ppm
          retention-days: 7
