name: mycelius CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout mycelius
        uses: actions/checkout@v4

      - name: Install toolchain (clang-18 / lld-18)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18

      - name: Build backboardd + launchpad (native)
        run: |
          make -C usr.sbin/backboardd
          make -C usr.sbin/launchpad

      - name: Cross-compile check (aarch64-unknown-freebsd, clang-18/lld-18)
        run: |
          make -C usr.sbin/backboardd clean >/dev/null
          make -C usr.sbin/backboardd cross CC=clang-18
          file usr.sbin/backboardd/backboardd
          make -C usr.sbin/backboardd clean >/dev/null
          make -C usr.sbin/launchpad clean >/dev/null
          make -C usr.sbin/launchpad cross CC=clang-18
          file usr.sbin/launchpad/launchpad

      - name: Smoke test (backboardd synth -> launchpad render -> PPM frame)
        run: |
          make -C usr.sbin/backboardd
          make -C usr.sbin/launchpad
          rm -f /tmp/lp_bb.sock /tmp/lp_frame.ppm
          ./usr.sbin/backboardd/backboardd -s /tmp/lp_bb.sock >/tmp/bb.log 2>&1 &
          BBPID=$!
          sleep 0.5
          ./usr.sbin/launchpad/launchpad -b /tmp/lp_bb.sock -o /tmp/lp_frame.ppm >/tmp/lp.log 2>&1 &
          LPPID=$!
          sleep 3
          kill $LPPID $BBPID 2>/dev/null || true
          wait $BBPID 2>/dev/null || true
          wait $LPPID 2>/dev/null || true
          test -s /tmp/lp_frame.ppm
          file /tmp/lp_frame.ppm | grep -q "480 x 800"
