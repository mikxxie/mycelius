name: mycelius CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout mycelius
        uses: actions/checkout@v4

      - name: Install toolchain (clang-18 / lld-18) + ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 ccache wget xz-utils

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build backboardd + launchpad (native, ccache)
        env:
          CC: ccache cc
        run: |
          CC="ccache cc" make -C usr.sbin/backboardd
          CC="ccache cc" make -C usr.sbin/launchpad

      - name: Fetch FreeBSD 15 aarch64 base sysroot (headers/libs)
        run: |
          SYSROOT=/tmp/freebsd-sysroot
          mkdir -p $SYSROOT
          # Try FreeBSD 15.0-RELEASE aarch64 base tarball.
          for url in \
            "https://download.freebsd.org/ftp/releases/arm64/aarch64/15.0-RELEASE/base.txz" \
            "https://download.freebsd.org/ftp/releases/arm64/aarch64/15.0-CURRENT/base.txz" \
            "https://download.freebsd.org/ftp/releases/arm64/aarch64/14.2-RELEASE/base.txz"; do
            echo "Trying $url ..."
            if wget -q -O /tmp/base.txz "$url"; then
              echo "Downloaded $url"
              tar -xJf /tmp/base.txz -C $SYSROOT ./usr/include ./usr/lib 2>/dev/null || \
              tar -xf /tmp/base.txz -C $SYSROOT ./usr/include ./usr/lib 2>/dev/null || true
              rm -f /tmp/base.txz
              if [ -d "$SYSROOT/usr/include" ]; then break; fi
            fi
          done
          ls $SYSROOT/usr/include | head
          echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV

      - name: Cross-compile for aarch64-unknown-freebsd (clang-18/lld-18)
        env:
          SYSROOT: /tmp/freebsd-sysroot
        run: |
          CFLAGS="-target aarch64-unknown-freebsd --sysroot=$SYSROOT \
                  -I$SYSROOT/usr/include -I../include \
                  -O2 -Wall -Wextra -std=c11"
          echo "=== backboardd ==="
          clang-18 $CFLAGS -c usr.sbin/backboardd/backboardd.c -o /tmp/bb.aarch64.o
          clang-18 $CFLAGS -c usr.sbin/launchpad/launchpad.c -o /tmp/lp.aarch64.o
          clang-18 $CFLAGS -c usr.sbin/launchpad/render.c -o /tmp/render.aarch64.o
          file /tmp/bb.aarch64.o /tmp/lp.aarch64.o /tmp/render.aarch64.o | grep -q aarch64
          echo "cross-compile OK"

      - name: Smoke test (backboardd synth -> launchpad render -> PPM frame)
        run: |
          make -C usr.sbin/backboardd
          make -C usr.sbin/launchpad
          rm -f /tmp/lp_bb.sock /tmp/lp_frame.ppm
          ./usr.sbin/backboardd/backboardd -s /tmp/lp_bb.sock >/tmp/bb.log 2>&1 &
          BBPID=$!
          sleep 0.5
          ./usr.sbin/launchpad/launchpad -b /tmp/lp_bb.sock -o /tmp/lp_frame.ppm >/tmp/lp.log 2>&1 &
          LPPID=$!
          sleep 3
          kill $LPPID $BBPID 2>/dev/null || true
          wait $BBPID 2>/dev/null || true
          wait $LPPID 2>/dev/null || true
          test -s /tmp/lp_frame.ppm
          file /tmp/lp_frame.ppm | grep -q "480 x 800"

      - name: Upload artifacts (binaries + rendered frame)
        uses: actions/upload-artifact@v4
        with:
          name: mycelius-ui-binaries
          path: |
            usr.sbin/backboardd/backboardd
            usr.sbin/launchpad/launchpad
            /tmp/lp_frame.ppm
          retention-days: 7
