name: mycelius CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout mycelius
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential ccache \
            aarch64-linux-gnu-gcc \
            cpio \
            curl xz-utils

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build backboardd + launchpad (native Linux)
        env:
          CC: ccache cc
        run: |
          CC="ccache cc" make -C usr.sbin/backboardd
          CC="ccache cc" make -C usr.sbin/launchpad
          file usr.sbin/backboardd/backboardd usr.sbin/launchpad/launchpad

      - name: Build QEMU initramfs image
        run: |
          sh tools/build-qemu-img.sh /tmp
          ls -lh /tmp/mycelius-initramfs.gz /tmp/mycelius-kernel 2>/dev/null || true

      - name: Cache QEMU image (initramfs + kernel)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/mycelius-initramfs.gz
            /tmp/mycelius-kernel
          key: mycelius-qemu-img-${{ github.sha }}
          restore-keys: |
            mycelius-qemu-img-

      - name: Smoke test (synth input → launchpad render → PPM)
        run: |
          rm -f /tmp/lp_bb.sock /tmp/lp_frame.ppm
          ./usr.sbin/backboardd/backboardd -s /tmp/lp_bb.sock >/tmp/bb.log 2>&1 &
          BBPID=$!
          sleep 0.5
          ./usr.sbin/launchpad/launchpad -b /tmp/lp_bb.sock -o /tmp/lp_frame.ppm >/tmp/lp.log 2>&1 &
          LPPID=$!
          sleep 3
          kill $LPPID $BBPID 2>/dev/null || true
          wait $BBPID 2>/dev/null || true
          wait $LPPID 2>/dev/null || true
          test -s /tmp/lp_frame.ppm
          file /tmp/lp_frame.ppm | grep -q "480 x 800"
          echo "Smoke test PASSED — frame is $(wc -c < /tmp/lp_frame.ppm) bytes"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mycelius-build
          path: |
            /tmp/mycelius-initramfs.gz
            /tmp/mycelius-kernel
            /tmp/backboardd.aarch64
            /tmp/launchpad.aarch64
            usr.sbin/backboardd/backboardd
            usr.sbin/launchpad/launchpad
            /tmp/lp_frame.ppm
            /tmp/bb.log
            /tmp/lp.log
          retention-days: 7
