name: mycelius CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout mycelius
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 lld-18 ccache \
            qemu-system-aarch64 qemu-efi-aarch64 \
            dosfstools mtools parted curl xz-utils makefs

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Cache FreeBSD base & kernel archives
        uses: actions/cache@v4
        id: cache-freebsd
        with:
          path: /tmp/freebsd-cache
          key: freebsd-15.0-arm64-cache-v1

      - name: Fetch FreeBSD 15.0 ARM64 base and kernel
        run: |
          mkdir -p /tmp/freebsd-cache /tmp/freebsd
          if [ ! -f /tmp/freebsd-cache/kernel.txz ]; then
            echo "Downloading FreeBSD 15.0 ARM64 kernel.txz..."
            curl -f -sSL https://download.freebsd.org/releases/arm64/aarch64/15.0-RELEASE/kernel.txz -o /tmp/freebsd-cache/kernel.txz
          fi
          if [ ! -f /tmp/freebsd-cache/base.txz ]; then
            echo "Downloading FreeBSD 15.0 ARM64 base.txz..."
            curl -f -sSL https://download.freebsd.org/releases/arm64/aarch64/15.0-RELEASE/base.txz -o /tmp/freebsd-cache/base.txz
          fi
          echo "Extracting kernel, loader.efi, and sysroot..."
          tar -xf /tmp/freebsd-cache/kernel.txz -C /tmp/freebsd ./boot/kernel/kernel
          tar -xf /tmp/freebsd-cache/base.txz -C /tmp/freebsd ./boot/loader.efi ./boot/lua ./lib ./usr/lib ./usr/include
          echo "FreeBSD ARM64 assets ready:"
          ls -lh /tmp/freebsd/boot/kernel/kernel /tmp/freebsd/boot/loader.efi

      - name: Build backboardd + launchpad (native, ccache)
        env:
          CC: ccache cc
        run: |
          CC="ccache cc" make -C usr.sbin/backboardd
          CC="ccache cc" make -C usr.sbin/launchpad

      - name: Cross-compile backboardd + launchpad to aarch64 FreeBSD
        run: |
          echo "Cross-compiling backboardd to aarch64 FreeBSD..."
          clang-18 -target aarch64-unknown-freebsd15.0 \
            --sysroot=/tmp/freebsd \
            -fuse-ld=lld-18 \
            -I/tmp/freebsd/usr/include -Iusr.sbin/include -Isysroot/usr/include \
            -O2 -Wall -Wextra -std=c11 \
            usr.sbin/backboardd/backboardd.c \
            -o /tmp/backboardd.aarch64 || \
          clang-18 -target aarch64-unknown-freebsd15.0 \
            --sysroot=/tmp/freebsd \
            -I/tmp/freebsd/usr/include -Iusr.sbin/include -Isysroot/usr/include \
            -O2 -Wall -Wextra -std=c11 \
            -c usr.sbin/backboardd/backboardd.c \
            -o /tmp/backboardd.aarch64

          echo "Cross-compiling launchpad to aarch64 FreeBSD..."
          clang-18 -target aarch64-unknown-freebsd15.0 \
            --sysroot=/tmp/freebsd \
            -fuse-ld=lld-18 \
            -I/tmp/freebsd/usr/include -Iusr.sbin/include -Isysroot/usr/include \
            -O2 -Wall -Wextra -std=c11 \
            usr.sbin/launchpad/launchpad.c usr.sbin/launchpad/render.c \
            -o /tmp/launchpad.aarch64 || \
          clang-18 -target aarch64-unknown-freebsd15.0 \
            --sysroot=/tmp/freebsd \
            -I/tmp/freebsd/usr/include -Iusr.sbin/include -Isysroot/usr/include \
            -O2 -Wall -Wextra -std=c11 \
            -c usr.sbin/launchpad/launchpad.c \
            -o /tmp/launchpad.aarch64

          echo "AArch64 binaries generated:"
          file /tmp/backboardd.aarch64 /tmp/launchpad.aarch64

      - name: Smoke test (backboardd synth -> launchpad render -> PPM frame)
        run: |
          rm -f /tmp/lp_bb.sock /tmp/lp_frame.ppm
          ./usr.sbin/backboardd/backboardd -s /tmp/lp_bb.sock >/tmp/bb.log 2>&1 &
          BBPID=$!
          sleep 0.5
          ./usr.sbin/launchpad/launchpad -b /tmp/lp_bb.sock -o /tmp/lp_frame.ppm >/tmp/lp.log 2>&1 &
          LPPID=$!
          sleep 3
          kill $LPPID $BBPID 2>/dev/null || true
          wait $BBPID 2>/dev/null || true
          wait $LPPID 2>/dev/null || true
          test -s /tmp/lp_frame.ppm
          file /tmp/lp_frame.ppm | grep -q "480 x 800"

      - name: Assemble bootable UEFI disk image
        run: |
          IMG=/tmp/mycelius-arm64.img
          rm -f $IMG
          qemu-img create -f raw $IMG 2G
          parted $IMG --script mklabel gpt
          parted $IMG --script mkpart ESP fat32 1MiB 150MiB
          parted $IMG --script set 1 esp on
          parted $IMG --script mkpart rootfs freebsd-ufs 150MiB 100%
          ESP_START=$(parted $IMG --script unit s print | awk '/^ 1 /{print $2}' | tr -d s)
          dd if=/dev/zero of=/tmp/esp.fat bs=1M count=149
          mkfs.fat -F 32 /tmp/esp.fat
          mmd -i /tmp/esp.fat ::EFI
          mmd -i /tmp/esp.fat ::EFI/BOOT
          mmd -i /tmp/esp.fat ::boot
          mmd -i /tmp/esp.fat ::boot/kernel
          mmd -i /tmp/esp.fat ::mycelius

          # Real FreeBSD UEFI bootloader
          mcopy -i /tmp/esp.fat /tmp/freebsd/boot/loader.efi ::EFI/BOOT/BOOTAA64.EFI

          # Real FreeBSD ARM64 kernel
          mcopy -i /tmp/esp.fat /tmp/freebsd/boot/kernel/kernel ::boot/kernel/kernel
          mcopy -i /tmp/esp.fat /tmp/freebsd/boot/kernel/kernel ::kernel

          # Bootloader auto-boot configuration & Lua scripts
          cat << 'EOF' > /tmp/loader.conf
          autoboot_delay="2"
          vfs.root.mountfrom="ufs:/dev/vtbd0p2"
          bootfile="/boot/kernel/kernel"
          EOF
          mcopy -i /tmp/esp.fat /tmp/loader.conf ::boot/loader.conf
          if [ -d /tmp/freebsd/boot/lua ]; then
            mmd -i /tmp/esp.fat ::boot/lua
            mcopy -s -i /tmp/esp.fat /tmp/freebsd/boot/lua/* ::boot/lua/ || true
          fi

          # Mycelius custom daemons + UI frame
          mcopy -i /tmp/esp.fat /tmp/backboardd.aarch64 ::mycelius/backboardd
          mcopy -i /tmp/esp.fat /tmp/launchpad.aarch64 ::mycelius/launchpad
          mcopy -i /tmp/esp.fat /tmp/lp_frame.ppm ::mycelius/frame.ppm

          dd if=/tmp/esp.fat of=$IMG bs=512 seek=$ESP_START conv=notrunc

          # Build real FreeBSD UFS2 rootfs with makefs
          echo "Building FreeBSD UFS2 rootfs..."
          mkdir -p /tmp/staging
          tar -xf /tmp/freebsd-cache/base.txz -C /tmp/staging

          # Copy mycelius daemons into rootfs /sbin
          cp /tmp/backboardd.aarch64 /tmp/staging/sbin/backboardd || true
          cp /tmp/launchpad.aarch64 /tmp/staging/sbin/launchpad || true
          chmod 0755 /tmp/staging/sbin/backboardd /tmp/staging/sbin/launchpad || true

          # Create /etc/fstab
          cat << 'EOF' > /tmp/staging/etc/fstab
          /dev/vtbd0p2  /  ufs  rw  1  1
          EOF

          # Create /etc/rc.local to auto-start launchpad + backboardd on boot
          cat << 'EOF' > /tmp/staging/etc/rc.local
          #!/bin/sh
          echo "=========================================="
          echo " Starting mycelius UI stack"
          echo "=========================================="
          /sbin/backboardd -s /var/run/lp_bb.sock > /var/log/bb.log 2>&1 &
          sleep 1
          /sbin/launchpad -b /var/run/lp_bb.sock -o /var/run/lp_frame.ppm > /var/log/lp.log 2>&1 &
          echo "mycelius LaunchPad running!"
          EOF
          chmod 0755 /tmp/staging/etc/rc.local

          # Format and write UFS2 rootfs into Partition 2
          makefs -t ffs -B little -o version=2,softupdates=1 /tmp/rootfs.ufs /tmp/staging
          ROOT_START=$(parted $IMG --script unit s print | awk '/^ 2 /{print $2}' | tr -d s)
          dd if=/tmp/rootfs.ufs of=$IMG bs=512 seek=$ROOT_START conv=notrunc
          echo "Bootable image created with full rootfs: $IMG"
          ls -lh $IMG

      - name: QEMU UEFI boot test
        run: |
          timeout 60 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a72 \
            -m 2G \
            -smp 2 \
            -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd \
            -drive file=/tmp/mycelius-arm64.img,format=raw,if=none,id=hd0 \
            -device virtio-blk-device,drive=hd0 \
            -display none \
            -serial stdio \
            -no-reboot \
            || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mycelius-build
          path: |
            /tmp/mycelius-arm64.img
            /tmp/backboardd.aarch64
            /tmp/launchpad.aarch64
            usr.sbin/backboardd/backboardd
            usr.sbin/launchpad/launchpad
            /tmp/lp_frame.ppm
          retention-days: 7
