name: mycelius CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout mycelius
        uses: actions/checkout@v4

      - name: Install toolchain (clang-18 / lld-18) + X11 test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 lld-18 \
            libxcb1-dev \
            xorg xvfb xinit xterm

      - name: Build winman + launcher (native)
        run: |
          make -C usr.sbin/winman

      - name: Verify clang-18 cross-compiles to aarch64 (object only)
        run: |
          cd usr.sbin/winman
          clang-18 -target aarch64-unknown-freebsd -O2 -Wall -Wextra -std=c11 \
            -c winman.c -o /tmp/winman.aarch64.o
          clang-18 -target aarch64-unknown-freebsd -O2 -Wall -Wextra -std=c11 \
            -c launcher.c -o /tmp/launcher.aarch64.o
          file /tmp/winman.aarch64.o /tmp/launcher.aarch64.o

      - name: Smoke test under Xephyr (headless)
        run: |
          Xephyr :99 -screen 800x600 -ac &
          XPID=$!
          sleep 2
          DISPLAY=:99 ./usr.sbin/winman/winman &
          WMPID=$!
          sleep 1
          DISPLAY=:99 ./usr.sbin/winman/launcher &
          LPPID=$!
          sleep 3
          kill $LPPID $WMPID $XPID 2>/dev/null || true
          wait $XPID 2>/dev/null || true
