name: mycelius CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout mycelius
        uses: actions/checkout@v4

      - name: Install toolchain (clang-18 / lld-18) + ccache + git
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 ccache git

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build backboardd + launchpad (native, ccache)
        env:
          CC: ccache cc
        run: |
          CC="ccache cc" make -C usr.sbin/backboardd
          CC="ccache cc" make -C usr.sbin/launchpad

      - name: Clone FreeBSD src (--depth=1) for real aarch64 headers/libs
        run: |
          git clone --depth=1 https://github.com/freebsd/freebsd-src.git /tmp/freebsd-src
          ls /tmp/freebsd-src/usr/include | head
          echo "FREEBSD_SRC=/tmp/freebsd-src" >> $GITHUB_ENV

      - name: Cross-compile for aarch64-unknown-freebsd (clang-18/lld-18)
        env:
          FREEBSD_SRC: /tmp/freebsd-src
        run: |
          SYSROOT="$FREEBSD_SRC/usr/include"
          echo "=== backboardd ==="
          clang-18 -target aarch64-unknown-freebsd --sysroot="$SYSROOT" \
            -I"$SYSROOT" -I../include \
            -O2 -Wall -Wextra -std=c11 \
            -c usr.sbin/backboardd/backboardd.c -o /tmp/backboardd.aarch64.o
          file /tmp/backboardd.aarch64.o | grep -q aarch64
          echo "=== launchpad ==="
          clang-18 -target aarch64-unknown-freebsd --sysroot="$SYSROOT" \
            -I"$SYSROOT" -I../include \
            -O2 -Wall -Wextra -std=c11 \
            -c usr.sbin/launchpad/launchpad.c -o /tmp/launchpad.aarch64.o
          clang-18 -target aarch64-unknown-freebsd --sysroot="$SYSROOT" \
            -I"$SYSROOT" -I../include \
            -O2 -Wall -Wextra -std=c11 \
            -c usr.sbin/launchpad/render.c -o /tmp/render.aarch64.o
          file /tmp/launchpad.aarch64.o /tmp/render.aarch64.o | grep -q aarch64
          echo "cross-compile OK"

      - name: Smoke test (backboardd synth -> launchpad render -> PPM frame)
        run: |
          make -C usr.sbin/backboardd
          make -C usr.sbin/launchpad
          rm -f /tmp/lp_bb.sock /tmp/lp_frame.ppm
          ./usr.sbin/backboardd/backboardd -s /tmp/lp_bb.sock >/tmp/bb.log 2>&1 &
          BBPID=$!
          sleep 0.5
          ./usr.sbin/launchpad/launchpad -b /tmp/lp_bb.sock -o /tmp/lp_frame.ppm >/tmp/lp.log 2>&1 &
          LPPID=$!
          sleep 3
          kill $LPPID $BBPID 2>/dev/null || true
          wait $BBPID 2>/dev/null || true
          wait $LPPID 2>/dev/null || true
          test -s /tmp/lp_frame.ppm
          file /tmp/lp_frame.ppm | grep -q "480 x 800"

      - name: Upload artifacts (binaries + rendered frame)
        uses: actions/upload-artifact@v4
        with:
          name: mycelius-ui-binaries
          path: |
            usr.sbin/backboardd/backboardd
            usr.sbin/launchpad/launchpad
            /tmp/lp_frame.ppm
          retention-days: 7
