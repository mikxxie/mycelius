name: mycelius CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout mycelius
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 lld-18 ccache bmake git wget xz-utils \
            qemu-system-aarch64 qemu-efi-aarch64 \
            dosfstools mtools parted build-essential flex

      - name: Cache ccache + objdir
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            /tmp/obj
          key: ${{ runner.os }}-freebsd-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-freebsd-

      - name: Create objdir
        run: mkdir -p /tmp/obj

      - name: Cross-build FreeBSD world (arm64)
        env:
          MAKEOBJDIRPREFIX: /tmp/obj
          TARGET: arm64
          TARGET_ARCH: aarch64
          CC: clang-18
          CXX: clang++-18
          CPP: clang-cpp-18
          XCC: clang-18
          XCXX: clang++-18
          XCPP: clang-cpp-18
          XLD: ld.lld-18
        run: |
          python3 tools/build/make.py buildworld \
            -DWITHOUT_CLEAN \
            -DWITH_AUTO_OBJ \
            TARGET=arm64 TARGET_ARCH=aarch64

      - name: Cross-build FreeBSD kernel (arm64, GENERIC)
        env:
          MAKEOBJDIRPREFIX: /tmp/obj
          TARGET: arm64
          TARGET_ARCH: aarch64
          CC: clang-18
          CXX: clang++-18
          CPP: clang-cpp-18
          XCC: clang-18
          XCXX: clang++-18
          XCPP: clang-cpp-18
          XLD: ld.lld-18
        run: |
          python3 tools/build/make.py buildkernel \
            KERNCONF=GENERIC \
            TARGET=arm64 TARGET_ARCH=aarch64

      - name: Install world + kernel to staging (-DNO_ROOT)
        env:
          MAKEOBJDIRPREFIX: /tmp/obj
          TARGET: arm64
          TARGET_ARCH: aarch64
          DESTDIR: /tmp/staging
          CC: clang-18
          CXX: clang++-18
          CPP: clang-cpp-18
          XCC: clang-18
          XCXX: clang++-18
          XCPP: clang-cpp-18
          XLD: ld.lld-18
        run: |
          mkdir -p /tmp/staging
          python3 tools/build/make.py installworld installkernel \
            -DNO_ROOT \
            DESTDIR=/tmp/staging \
            TARGET=arm64 TARGET_ARCH=aarch64

      - name: Build host tools (makefs, mkimg)
        env:
          MAKEOBJDIRPREFIX: /tmp/obj
          CC: clang-18
          CXX: clang++-18
        run: |
          make -C sbin/makefs OBJDIR=/tmp/obj/makefs || true
          make -C tools/tools/mkimg OBJDIR=/tmp/obj/mkimg 2>/dev/null || \
          make -C usr.sbin/mkimg OBJDIR=/tmp/obj/mkimg 2>/dev/null || true

      - name: Assemble UEFI boot disk image
        env:
          STAGING: /tmp/staging
        run: |
          IMG=/tmp/mycelius-arm64.img
          rm -f $IMG
          qemu-img create -f raw $IMG 2G
          parted $IMG --script mklabel gpt
          parted $IMG --script mkpart ESP fat32 1MiB 101MiB
          parted $IMG --script set 1 esp on
          parted $IMG --script mkpart rootfs freebsd-ufs 101MiB 100%
          ESP_START=$(parted $IMG --script unit s print | awk '/^ 1 /{print $2}' | tr -d s)
          dd if=/dev/zero of=/tmp/esp.fat bs=1M count=100
          mkfs.fat -F 32 /tmp/esp.fat
          mmd -i /tmp/esp.fat ::EFI
          mmd -i /tmp/esp.fat ::EFI/BOOT
          mcopy -i /tmp/esp.fat $STAGING/boot/loader.efi ::EFI/BOOT/BOOTAA64.EFI
          mcopy -i /tmp/esp.fat $STAGING/boot/kernel/kernel ::kernel
          dd if=/tmp/esp.fat of=$IMG bs=512 seek=$ESP_START conv=notrunc
          echo "Image created: $IMG"
          ls -lh $IMG

      - name: QEMU UEFI boot test
        run: |
          timeout 60 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a72 \
            -m 2G \
            -smp 2 \
            -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd \
            -drive file=/tmp/mycelius-arm64.img,format=raw,if=none,id=hd0 \
            -device virtio-blk-device,drive=hd0 \
            -display none \
            -serial stdio \
            -no-reboot \
            || true

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mycelius-arm64-img
          path: /tmp/mycelius-arm64.img
          retention-days: 7
